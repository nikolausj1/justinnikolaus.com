<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1800, height=1200" />
    <title>The Nikolaus Times vignette</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="lib/vignette.css" />
    <style>
      /* Newsprint glow: warm, low, so the paper reads white against it. */
      :root { --glow-a: rgba(214, 190, 150, 0.30); --glow-b: rgba(160, 130, 90, 0.12); --mark-glow: rgba(214, 190, 150, 0.20); --mark-glow-soft: rgba(214, 190, 150, 0.04); }
      /* The review screen is laid out in footage pixels (2400 x 1600) and scaled to the screen (fit 1560 / 2400). */
      .screen .review { position: absolute; left: 0; top: 0; width: 2400px; height: 1600px; transform-origin: 0 0; transform: scale(0.65); background: #e9e8e4; }
      .screen .review img.pg { position: absolute; left: 591px; top: 60px; width: 1219px; height: 1480px; object-fit: fill; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.16), 0 0 0 1px rgba(0, 0, 0, 0.08); }
      .screen .review img.pg-final { opacity: 0; }
      .screen .review svg.pen { position: absolute; left: 0; top: 0; width: 2400px; height: 1600px; overflow: visible; }
      .pen path { fill: none; stroke: #d2301f; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
      .pen #pen-check { stroke-width: 12; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.9" data-width="1800" data-height="1200">
      <div class="stage" id="stage">
        <div class="glow" id="glow" data-layout-allow-overflow></div>
        <div class="floor"></div>
        <div class="shot" id="shot-review" data-layout-allow-overflow>
          <div class="cam-outer" data-layout-allow-overflow>
            <div class="cam-inner">
              <div class="device" data-layout-allow-overflow data-layout-allow-occlusion>
                <div class="dots"><i></i><i></i><i></i></div>
                <div class="screen">
                  <div class="review">
                    <img class="pg pg-first" id="pg-first" src="assets/page2-first-pass.png" alt="" />
                    <img class="pg pg-final" id="pg-final" src="assets/page2-final.png" alt="" />
                    <svg class="pen" id="pen" viewBox="0 0 2400 1600">
                      <g id="pen-marks">
                        <path id="pen-strike" pathLength="1" d="M1163,299 C1228,291 1300,293 1368,281" />
                        <path id="pen-ring" pathLength="1" d="M905,346 C1120,341 1200,396 1190,430 C1180,478 1016,512 880,508 C712,504 610,470 616,426 C622,380 756,348 948,352" />
                        <path id="pen-slash" pathLength="1" d="M1262,706 C1400,610 1560,500 1706,404" />
                      </g>
                      <path id="pen-check" pathLength="1" d="M1182,232 L1216,270 L1300,166" />
                    </svg>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="mark" id="mark">
        <div class="mark-glow"></div>
        <img class="icon" id="icon" src="assets/nt-icon.png" alt="" />
      </div>
    </div>
    <script src="lib/vignette.js"></script>
    <script>
      // Shot one is not footage: the review screen is two real page renders from issue 2 (the Friday first pass and the
      // printed final of page 2) with Justin's red pen drawn over the first pass. All of it is a pure function of t.
      // Page px map to footage px as x * 1.1608 + 591, y * 1.1608 + 60. "Baked" sits at page x 506 to 654, y 168 to 221;
      // the 13-word story at x 57 to 477, y 271 to 353; the guessed pie art at x 540 to 993, y 273 to 575.
      const START = 1.3;
      const PAGE = { x: 1200, y: 800 };
      const STORY = { x: 1200, y: 480 };
      const seg = (t, at, dur) => {
        const u = Math.min(1, Math.max(0, (t - at) / dur));
        return u * u * (3 - 2 * u);
      };
      const el = (id) => document.getElementById(id);
      const strike = el("pen-strike"), ring = el("pen-ring"), slash = el("pen-slash"), check = el("pen-check");
      const marks = el("pen-marks"), finalPg = el("pg-final");
      Vignette.init({
        D: 9.9,
        shots: [{
          id: "shot-review", frame: "browser", src: { w: 2400, h: 1600 }, fit: { w: 1560 },
          start: START, len: 7.6,
          keys: [
            { t: 0.0, s: 1.0, p: PAGE },
            { t: 0.6, s: 1.0, p: PAGE },
            { t: 1.8, s: 1.85, p: STORY },
            { t: 6.6, s: 1.85, p: STORY },
            { t: 7.6, s: 1.0, p: PAGE },
          ],
        }],
        extra(t) {
          const ft = t - START;
          strike.style.strokeDashoffset = String(1 - seg(ft, 2.0, 0.35));
          ring.style.strokeDashoffset = String(1 - seg(ft, 2.6, 0.65));
          slash.style.strokeDashoffset = String(1 - seg(ft, 3.5, 0.35));
          const swap = seg(ft, 4.5, 0.7);
          finalPg.style.opacity = String(swap);
          marks.style.opacity = String(1 - swap);
          check.style.strokeDashoffset = String(1 - seg(ft, 5.6, 0.35));
        },
      });
    </script>
  </body>
</html>
