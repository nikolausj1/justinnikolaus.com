<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1800, height=1200" />
    <title>Paper Telegram vignette</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="lib/vignette.css" />
    <style>
      :root { --glow-a: rgba(70, 120, 200, 0.4); --glow-b: rgba(40, 80, 150, 0.16); --mark-glow: rgba(70, 120, 200, 0.22); --mark-glow-soft: rgba(70, 120, 200, 0.05); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.85" data-width="1800" data-height="1200">
      <div class="stage" id="stage">
        <div class="glow" id="glow" data-layout-allow-overflow></div>
        <div class="floor"></div>
      <div class="shot" id="shot-web" data-layout-allow-overflow>
        <div class="cam-outer" data-layout-allow-overflow>
          <div class="cam-inner">
            <div class="device" data-layout-allow-overflow data-layout-allow-occlusion>
              <div class="dots"><i></i><i></i><i></i></div>
              <div class="screen">
                <img class="last" src="assets/paper-web-2400-last.jpg" alt="" />
                <video id="v-web" class="clip" src="assets/paper-web-2400.mp4" muted playsinline data-start="1.3" data-duration="6.4" data-track-index="0"></video>
                <img class="first" src="assets/paper-web-2400-first.jpg" alt="" />
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="shot" id="shot-print" data-layout-allow-overflow>
        <div class="cam-outer" data-layout-allow-overflow>
          <div class="cam-inner">
            <div class="device" data-layout-allow-overflow data-layout-allow-occlusion>
              
              <div class="screen">
                <img class="last" src="assets/paper-print-1800-last.jpg" alt="" />
                <video id="v-print" class="clip" src="assets/paper-print-1800.mp4" muted playsinline data-start="7.7" data-duration="2.77" data-track-index="0"></video>
                <img class="first" src="assets/paper-print-1800-first.jpg" alt="" />
              </div>
            </div>
          </div>
        </div>
      </div>
      </div>
      <div class="mark" id="mark">
        <div class="mark-glow"></div>
        <img class="icon" id="icon" src="assets/paper-icon.png" alt="" />
      </div>
    </div>
    <script src="lib/vignette.js"></script>
    <script>
      // Shot one (assets/paper-web-2400.mp4, 2400 x 1600, 6.4 s): the form, Vinny picked at 0.87, Dad typed 2.5 to 2.8,
      // "I love you two!" typed 4.1 to 5.8. Shot two (assets/paper-print-1800.mp4, 2.77 s): the printer, the note rising from 0.6.
      const PAGE = { x: 1200, y: 800 };
      const CARD = { x: 1800, y: 960 };
      const FIELD = { x: 1800, y: 1085 };
      Vignette.init({
        D: 12.85,
        shots: [{
          id: "shot-web", frame: "browser", src: { w: 2400, h: 1600 }, fit: { w: 1560 },
          start: 1.3, len: 6.4,
          keys: [
            { t: 0.0, s: 1.0, p: PAGE },
            { t: 0.6, s: 1.0, p: PAGE },
            { t: 1.6, s: 1.6, p: CARD },
            { t: 3.6, s: 1.6, p: CARD },
            { t: 4.6, s: 1.9, p: FIELD },
            { t: 6.4, s: 1.9, p: FIELD },
          ],
        }, {
          id: "shot-print", frame: "none", src: { w: 1800, h: 1200 }, fit: { w: 1800 },
          start: 7.7, len: 2.77,
          keys: [
            { t: 0.0, s: 1.0, p: { x: 900, y: 600 } },
            { t: 4.2, s: 1.32, p: { x: 900, y: 540 } },
          ],
        }],
      });
    </script>
  </body>
</html>
