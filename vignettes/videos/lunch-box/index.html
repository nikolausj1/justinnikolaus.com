<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1800, height=1200" />
    <title>Lunch Box Drawings vignette</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="lib/vignette.css" />
    <style>
      :root { --glow-a: rgba(240, 200, 90, 0.34); --glow-b: rgba(200, 150, 50, 0.12); --mark-glow: rgba(240, 200, 90, 0.18); --mark-glow-soft: rgba(240, 200, 90, 0.05); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13.6" data-width="1800" data-height="1200">
      <div class="stage" id="stage">
        <div class="glow" id="glow" data-layout-allow-overflow></div>
        <div class="floor"></div>
      <div class="shot" id="shot-web" data-layout-allow-overflow>
        <div class="cam-outer" data-layout-allow-overflow>
          <div class="cam-inner">
            <div class="device" data-layout-allow-overflow data-layout-allow-occlusion>
              <div class="dots"><i></i><i></i><i></i></div>
              <div class="screen">
                <img class="last" src="assets/lunchbox-flow-2400-last.jpg" alt="" />
                <video id="v-web" class="clip" src="assets/lunchbox-flow-2400.mp4" muted playsinline data-start="1.3" data-duration="10.4" data-track-index="0"></video>
                <img class="first" src="assets/lunchbox-flow-2400-first.jpg" alt="" />
              </div>
            </div>
          </div>
        </div>
      </div>
      </div>
      <div class="mark" id="mark">
        <div class="mark-glow"></div>
        <img class="icon" id="icon" src="assets/lunchbox-icon.png" alt="" />
      </div>
    </div>
    <script src="lib/vignette.js"></script>
    <script>
      // Footage beats (seconds into assets/lunchbox-flow-2400.mp4, 2400 x 1600): welcome dismissed 0.35, drawings in place 0.8,
      // grid scroll 2.7 to 5.2, Wall clicked 5.6 and settled 7.1, the jump to 2022 7.4 to 8.3, the astronaut note opens 9.0, hold to 10.4.
      const PAGE = { x: 1200, y: 800 };
      const GRID = { x: 1200, y: 820 };
      Vignette.init({
        D: 13.6,
        shots: [{
          id: "shot-web", frame: "browser", src: { w: 2400, h: 1600 }, fit: { w: 1560 },
          start: 1.3, len: 10.4,
          keys: [
            { t: 0.0, s: 1.0, p: PAGE },
            { t: 2.5, s: 1.0, p: PAGE },
            { t: 3.2, s: 1.15, p: GRID },
            { t: 5.2, s: 1.15, p: GRID },
            { t: 6.3, s: 1.3, p: PAGE },
            { t: 8.6, s: 1.3, p: PAGE },
            { t: 9.6, s: 1.7, p: PAGE },
            { t: 10.4, s: 1.7, p: PAGE },
            { t: 11.4, s: 1.0, p: PAGE },
          ],
        }],
      });
    </script>
  </body>
</html>
