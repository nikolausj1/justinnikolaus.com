<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Claw Game</title>
  <desc id="desc">A playful neon claw machine grabbing a star toy.</desc>
  <defs>
