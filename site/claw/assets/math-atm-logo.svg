<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 190" role="img" aria-labelledby="title desc">
  <title id="title">MATH ATM</title>
  <desc id="desc">An old-school cash machine sign with glowing green MATH above ATM.</desc>
  <defs>
