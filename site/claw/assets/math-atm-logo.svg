      <stop offset="0" stop-color="#e0e6e5"/>
      <stop offset=".13" stop-color="#7f8a8e"/>
      <stop offset=".28" stop-color="#c7cecd"/>
      <stop offset=".58" stop-color="#697579"/>
      <stop offset=".82" stop-color="#aeb8b8"/>
