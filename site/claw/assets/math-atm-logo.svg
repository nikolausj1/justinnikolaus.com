  <path d="M112 100h296" stroke="#57d979" stroke-opacity=".65" stroke-width="2"/>
  <text x="260" y="144" fill="#9cffad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="51" font-weight="900" letter-spacing="14" text-anchor="middle" filter="url(#phosphor)">ATM</text>
