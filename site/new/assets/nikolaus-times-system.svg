<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="System diagram. Wednesday: AI pitches stories from the week's sources and I mark each Run, Hold or Spike. Friday: an event judge, writer, fact checker and art desk draft the paper against my house rules, while code measures every slot from the component library. An AI reviewer checks the draft and sends me a proof; my edits re-render the pages and my notes become new house rules. Saturday: it prints only on my go.">
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#161616"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#225caa"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f97"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d2301f"/></marker>
  </defs>
  <rect width="1200" height="540" fill="#ffffff"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <!-- lane bands -->
    <rect x="0" y="52" width="1200" height="150" fill="#f4f4f4"/>
    <rect x="0" y="212" width="1200" height="150" fill="#f1f6ff"/>
    <rect x="0" y="372" width="1200" height="150" fill="#fafafa"/>

    <!-- time header -->
    <g font-size="11" font-weight="600" fill="#727780" letter-spacing="1.2" text-anchor="middle">
      <text x="215" y="30">WEDNESDAY</text>
      <text x="570" y="30">FRIDAY 09:40 · FIRST PASS</text>
      <text x="935" y="30">FRIDAY · REVIEW</text>
      <text x="1115" y="30">SATURDAY 07:30</text>
    </g>
    <line x1="140" y1="42" x2="1190" y2="42" stroke="#e5e5e5"/>

    <!-- lane labels -->
    <g font-size="14" font-weight="700" fill="#161616" letter-spacing="0.6">
      <text x="16" y="122">ME</text>
      <text x="16" y="282">AI AGENTS</text>
      <text x="16" y="442">CODE</text>
    </g>
    <g font-size="11" fill="#727780">
      <text x="16" y="139">the editor</text>
      <text x="16" y="299">the newsroom</text>
      <text x="16" y="459">the press room</text>
    </g>

    <!-- ME lane -->
    <g>
      <rect x="140" y="78" width="150" height="94" rx="10" fill="#161616"/>
      <text x="152" y="102" font-size="14" font-weight="650" fill="#fff">News budget</text>
      <text x="152" y="122" font-size="11" fill="#c9ccd1">Run · Hold · Spike</text>
      <text x="152" y="144" font-size="11" fill="#c9ccd1">I pick each boy's</text>
      <text x="152" y="159" font-size="11" fill="#c9ccd1">stories for the week</text>

      <rect x="455" y="82" width="235" height="86" rx="10" fill="#ffffff" stroke="#161616" stroke-width="2"/>
      <text x="469" y="106" font-size="14" font-weight="650" fill="#161616">House rules</text>
      <text x="469" y="126" font-size="11" fill="#555">One page I edit in plain words.</text>
      <text x="469" y="142" font-size="11" fill="#555">Every draft is read against it.</text>
      <text x="469" y="158" font-size="11" fill="#555">Each rule keeps its history.</text>

      <rect x="850" y="78" width="170" height="94" rx="10" fill="#161616"/>
      <text x="862" y="102" font-size="14" font-weight="650" fill="#fff">Page review</text>
      <text x="862" y="122" font-size="11" fill="#c9ccd1">Editor-in-chief</text>
      <text x="862" y="144" font-size="11" fill="#c9ccd1">I approve every page</text>
      <text x="862" y="159" font-size="11" fill="#c9ccd1">or mark it up</text>

      <rect x="1040" y="78" width="150" height="94" rx="10" fill="#161616"/>
      <text x="1052" y="102" font-size="14" font-weight="650" fill="#fff">Go to press</text>
      <text x="1052" y="122" font-size="11" fill="#c9ccd1">Publisher's call</text>
      <text x="1052" y="144" font-size="11" fill="#c9ccd1">Nothing prints</text>
      <text x="1052" y="159" font-size="11" fill="#c9ccd1">without my word</text>
    </g>

    <!-- AI lane -->
    <g font-size="11" fill="#555">
      <rect x="140" y="238" width="150" height="94" rx="10" fill="#eaf2ff" stroke="#5ea4ff" stroke-width="1.5"/>
      <text x="152" y="262" font-size="14" font-weight="650" fill="#161616">Pitch desk</text>
      <text x="152" y="282" fill="#225caa">Story pitches</text>
      <text x="152" y="304">Candidate stories</text>
      <text x="152" y="319">for each boy</text>

      <rect x="310" y="238" width="115" height="94" rx="10" fill="#eaf2ff" stroke="#5ea4ff" stroke-width="1.5"/>
      <text x="320" y="262" font-size="14" font-weight="650" fill="#161616">Event judge</text>
      <text x="320" y="282" fill="#225caa">Assignments</text>
      <text x="320" y="304">What matters</text>
      <text x="320" y="319">to which boy</text>

      <rect x="445" y="238" width="115" height="94" rx="10" fill="#eaf2ff" stroke="#5ea4ff" stroke-width="1.5"/>
      <text x="455" y="262" font-size="14" font-weight="650" fill="#161616">Writer</text>
      <text x="455" y="282" fill="#225caa">Reporter</text>
      <text x="455" y="304">Two reading</text>
      <text x="455" y="319">levels, to fit</text>

      <rect x="580" y="238" width="115" height="94" rx="10" fill="#eaf2ff" stroke="#5ea4ff" stroke-width="1.5"/>
      <text x="590" y="262" font-size="14" font-weight="650" fill="#161616">Fact checker</text>
      <text x="590" y="282" fill="#225caa">Copy desk</text>
      <text x="590" y="304">No source,</text>
      <text x="590" y="319">no sentence</text>

      <rect x="715" y="238" width="115" height="94" rx="10" fill="#eaf2ff" stroke="#5ea4ff" stroke-width="1.5"/>
      <text x="725" y="262" font-size="14" font-weight="650" fill="#161616">Art desk</text>
      <text x="725" y="282" fill="#225caa">Illustrator</text>
      <text x="725" y="304">Drawing briefs</text>
      <text x="725" y="319">for an image model</text>

      <rect x="850" y="238" width="140" height="94" rx="10" fill="#eaf2ff" stroke="#5ea4ff" stroke-width="1.5"/>
      <text x="862" y="262" font-size="14" font-weight="650" fill="#161616">Reviewer</text>
      <text x="862" y="282" fill="#225caa">Slot editor</text>
      <text x="862" y="304">Reads the draft</text>
      <text x="862" y="319">against my rules</text>
    </g>

    <!-- CODE lane -->
    <g font-size="11" fill="#555">
      <rect x="140" y="398" width="150" height="94" rx="10" fill="#ffffff" stroke="#9ca1a8" stroke-width="1.5"/>
      <text x="152" y="422" font-size="14" font-weight="650" fill="#161616">Sources</text>
      <text x="152" y="442" fill="#727780">The wire</text>
      <text x="152" y="464">Calendars, school,</text>
      <text x="152" y="479">weather, feeds, email</text>

      <rect x="310" y="398" width="250" height="94" rx="10" fill="#ffffff" stroke="#9ca1a8" stroke-width="1.5"/>
      <text x="322" y="422" font-size="14" font-weight="650" fill="#161616">Component library</text>
      <text x="322" y="442" fill="#727780">The type case</text>
      <text x="322" y="464">59 modules · sizes S, M, L · four</text>
      <text x="322" y="479">content states · two reading levels</text>

      <rect x="580" y="398" width="250" height="94" rx="10" fill="#ffffff" stroke="#9ca1a8" stroke-width="1.5"/>
      <text x="592" y="422" font-size="14" font-weight="650" fill="#161616">Compositor</text>
      <text x="592" y="442" fill="#727780">Paste-up</text>
      <text x="592" y="464">Measures every slot in inches.</text>
      <text x="592" y="479">Never shrinks type to make it fit.</text>

      <rect x="850" y="398" width="170" height="94" rx="10" fill="#ffffff" stroke="#9ca1a8" stroke-width="1.5"/>
      <text x="862" y="422" font-size="14" font-weight="650" fill="#161616">Validator</text>
      <text x="862" y="442" fill="#727780">Proof desk</text>
      <text x="862" y="464">Fit, overflow, reading</text>
      <text x="862" y="479">floor, every page</text>

      <rect x="1040" y="398" width="150" height="94" rx="10" fill="#ffffff" stroke="#9ca1a8" stroke-width="1.5"/>
      <text x="1052" y="422" font-size="14" font-weight="650" fill="#161616">Press</text>
      <text x="1052" y="442" fill="#727780">The press run</text>
      <text x="1052" y="464">Imposed, flattened,</text>
      <text x="1052" y="479">two Legal sheets</text>
    </g>

    <!-- arrows -->
    <g fill="none" stroke-width="1.6">
      <path d="M190,398 V334" stroke="#8a8f97" marker-end="url(#a-grey)"/>
      <path d="M290,412 H300 V362 H360 V334" stroke="#8a8f97" marker-end="url(#a-grey)"/>
      <path d="M170,238 V174" stroke="#225caa" marker-end="url(#a-blue)"/>
      <path d="M262,172 V236" stroke="#161616" stroke-dasharray="5 4" marker-end="url(#a-ink)"/>
      <path d="M290,118 H372 V236" stroke="#161616" marker-end="url(#a-ink)"/>
      <path d="M425,285 H443" stroke="#225caa" marker-end="url(#a-blue)"/>
      <path d="M560,285 H578" stroke="#225caa" marker-end="url(#a-blue)"/>
      <path d="M695,285 H713" stroke="#225caa" marker-end="url(#a-blue)"/>
      <path d="M520,168 V236" stroke="#161616" marker-end="url(#a-ink)"/>
      <path d="M676,168 V194 H872 V236" stroke="#161616" marker-end="url(#a-ink)"/>
      <path d="M502,398 V334" stroke="#8a8f97" marker-end="url(#a-grey)"/>
      <path d="M637,332 V396" stroke="#225caa" marker-end="url(#a-blue)"/>
      <path d="M772,332 V396" stroke="#225caa" marker-end="url(#a-blue)"/>
      <path d="M560,445 H578" stroke="#8a8f97" marker-end="url(#a-grey)"/>
      <path d="M830,445 H848" stroke="#8a8f97" marker-end="url(#a-grey)"/>
      <path d="M900,398 V334" stroke="#8a8f97" marker-end="url(#a-grey)"/>
      <path d="M900,238 V174" stroke="#225caa" marker-end="url(#a-blue)"/>
      <path d="M1005,172 V396" stroke="#161616" marker-end="url(#a-ink)"/>
      <path d="M1020,125 H1038" stroke="#161616" marker-end="url(#a-ink)"/>
      <path d="M1115,172 V396" stroke="#161616" marker-end="url(#a-ink)"/>
      <path d="M850,112 H692" stroke="#d2301f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-red)"/>
    </g>

    <!-- arrow labels -->
    <g font-size="10.5" font-style="italic" fill="#727780">
      <text x="196" y="381">the week's records</text>
      <text x="176" y="214">budget page</text>
      <text x="268" y="226">pitch me more</text>
      <text x="298" y="111">my picks</text>
      <text x="527" y="205">read every week</text>
      <text x="508" y="370">slot size in inches,</text>
      <text x="508" y="383">word budget per field</text>
      <text x="643" y="370">checked copy</text>
      <text x="778" y="370">drawings</text>
      <text x="906" y="370">proof pages</text>
      <text x="906" y="214">proof and a</text>
      <text x="906" y="227">must-fix list</text>
      <text x="1012" y="290">my edits</text>
      <text x="1122" y="290">my go</text>
    </g>
    <g font-size="12" font-weight="650" fill="#d2301f" text-anchor="middle">
      <text x="771" y="104">notes become rules</text>
      <text x="771" y="130" font-weight="500" font-size="11">same day</text>
    </g>
    <text x="1190" y="518" font-size="11" font-weight="650" fill="#161616" text-anchor="end" letter-spacing="0.6">TWO PAPERS ON THE TABLE</text>
  </g>
</svg>
