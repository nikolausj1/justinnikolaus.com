<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 960" role="img" aria-label="Four steps each week: I pick the stories, AI agents write and check them, code lays out the pages, and I edit and approve. My notes become rules the agents read next week.">
  <rect width="600" height="960" fill="#ffffff"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <!-- step 1: me -->
    <rect x="40" y="40" width="430" height="150" rx="18" fill="#161616"/>
    <text x="72" y="88" font-size="22" font-weight="600" fill="#a9adb4" letter-spacing="1.5">1 · ME</text>
    <text x="72" y="128" font-size="34" font-weight="650" fill="#ffffff" letter-spacing="-0.8">Pick the stories</text>
    <text x="72" y="166" font-size="23" fill="#c9ccd1">Like a budget meeting</text>

    <path d="M255,190 V230" stroke="#727780" stroke-width="3"/><path d="M245,222 L255,236 L265,222" fill="none" stroke="#727780" stroke-width="3" stroke-linejoin="round"/>

    <!-- step 2: agents -->
    <rect x="40" y="240" width="430" height="150" rx="18" fill="#eaf2ff" stroke="#5ea4ff" stroke-width="3"/>
    <text x="72" y="288" font-size="22" font-weight="600" fill="#225caa" letter-spacing="1.5">2 · AI AGENTS</text>
    <text x="72" y="328" font-size="34" font-weight="650" fill="#161616" letter-spacing="-0.8">Write and check</text>
    <text x="72" y="366" font-size="23" fill="#555555">Like reporters and a copy desk</text>

    <path d="M255,390 V430" stroke="#727780" stroke-width="3"/><path d="M245,422 L255,436 L265,422" fill="none" stroke="#727780" stroke-width="3" stroke-linejoin="round"/>

    <!-- step 3: code -->
    <rect x="40" y="440" width="430" height="150" rx="18" fill="#f8f9fa" stroke="#9ca1a8" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="72" y="488" font-size="22" font-weight="600" fill="#727780" letter-spacing="1.5">3 · CODE</text>
    <text x="72" y="528" font-size="34" font-weight="650" fill="#161616" letter-spacing="-0.8">Lay out four pages</text>
    <text x="72" y="566" font-size="23" fill="#555555">Like the paste-up room</text>

    <path d="M255,590 V630" stroke="#727780" stroke-width="3"/><path d="M245,622 L255,636 L265,622" fill="none" stroke="#727780" stroke-width="3" stroke-linejoin="round"/>

    <!-- step 4: me -->
    <rect x="40" y="640" width="430" height="150" rx="18" fill="#161616"/>
    <text x="72" y="688" font-size="22" font-weight="600" fill="#a9adb4" letter-spacing="1.5">4 · ME</text>
    <text x="72" y="728" font-size="34" font-weight="650" fill="#ffffff" letter-spacing="-0.8">Edit and approve</text>
    <text x="72" y="766" font-size="23" fill="#c9ccd1">Like the editor-in-chief</text>

    <!-- the loop: notes become rules -->
    <path d="M470,715 H530 Q556,715 556,689 V341 Q556,315 530,315 H482" fill="none" stroke="#d2301f" stroke-width="3.5" stroke-dasharray="9 7"/>
    <path d="M494,305 L478,315 L494,325" fill="none" stroke="#d2301f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="572" y="515" font-size="21" font-weight="600" fill="#d2301f" text-anchor="middle" transform="rotate(90 572 515)">My notes become rules</text>

    <!-- out -->
    <path d="M255,790 V830" stroke="#727780" stroke-width="3"/><path d="M245,822 L255,836 L265,822" fill="none" stroke="#727780" stroke-width="3" stroke-linejoin="round"/>
    <text x="255" y="882" font-size="30" font-weight="650" fill="#161616" text-anchor="middle" letter-spacing="-0.6">Prints Saturday, 7:30 a.m.</text>
    <text x="255" y="918" font-size="22" fill="#727780" text-anchor="middle">Only after I approve every page</text>
  </g>
</svg>
